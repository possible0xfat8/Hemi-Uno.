    <script>
      (function() {
        // Guard against wallet extension collisions (e.g., Zerion, MetaMask, Rabby redefining properties on window.ethereum)
        var originalDefineProperty = Object.defineProperty;
        try {
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              if (descriptor && typeof descriptor === 'object') {
                return originalDefineProperty.call(Object, obj, prop, Object.assign({}, descriptor, { configurable: true }));
              }
              return originalDefineProperty.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (
                err instanceof TypeError &&
                (String(err && err.message).includes('Cannot redefine property') ||
                 String(prop).includes('isZerion') ||
                 String(prop).includes('ethereum'))
              ) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
              throw err;
            }
          };
        } catch (_) {}

        // Global unhandled error suppression for extension injection collisions
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (
            msg.includes('isZerion') ||
            msg.includes('Cannot redefine property')
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
          if (
            msg.includes('isZerion') ||
            msg.includes('Cannot redefine property')
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
